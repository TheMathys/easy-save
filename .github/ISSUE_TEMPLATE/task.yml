name: "📋 Tâche"
description: "Template avec Definition of Ready (DoR) intégrée."
title: "[TASK] "
labels: ["task", "DoR"]
body:
  - type: textarea
    id: contexte
    attributes:
      label: "## Contexte"
      description: Fournis le contexte métier/technique.
      placeholder: "Créer un template d'issue GitHub standardisé..."
    validations:
      required: true

  - type: textarea
    id: lien-fonctionnel
    attributes:
      label: "## Lien fonctionnel"
      description: Epic, user story, issues liées.
      placeholder: "- Epic : #3"

  - type: textarea
    id: travail
    attributes:
      label: "## Travail à réaliser"
      description: Checklist des étapes.
      placeholder: "- [ ] Créer le dossier .github...\n- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: dor
    attributes:
      label: "# ✅ Definition of Ready (DoR) - À valider"
      description: "**Copie-colle et coche TOUS les critères avant de considérer la tâche Ready.**"
      placeholder: `# Definition of Ready (DoR)

## Une tâche est Ready quand :

**✅ Titre et description claire et concise** de la fonctionnalité ou de la tâche.

**✅ Acceptation des critères par l'équipe** (Product Owner, développeurs, testeurs, Scrum Master).

**✅ Estimation de la complexité** (en points d'histoire, jours, etc.).

**✅ Critères d'acceptation bien définis**, spécifiques et testables.

**✅ Conformité aux principes INVEST :**
- **I**ndépendante
- **N**égociable 
- **V**aluable
- **E**stimable
- **P**etite
- **T**estable

**Status DoR : [ ] READY / [ ] À raffiner**`
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "## Critères d'acceptation (DoD)"
      description: Critères testables pour la livraison.
      placeholder: "- [ ] Fichier task.yml créé et valide\n- [ ] Template visible sur GitHub"
    validations:
      required: true

  - type: textarea
    id: dependances
    attributes:
      label: "## Dépendances"
      placeholder: "- [ ] Dépend de : #4"

  - type: input
    id: estimation
    attributes:
      label: "Estimation"
      description: Points d'histoire ou jours.
      placeholder: "3 SP"
      type: number
      validations:
        required: true
