services:
  logserver:
    build:
      context: .
      dockerfile: src/EasySave.LogServer/Dockerfile
    container_name: easysave-logserver
    ports:
      - "${LOG_SERVER_PORT:-9050}:9050"
    environment:
      - LOG_SERVER_PORT=9050
      - LOG_DIR=/logs
    volumes:
      - logdata:/logs
    restart: unless-stopped

volumes:
  logdata:
